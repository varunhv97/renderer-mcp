name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          # Windows CI uses the WARP software adapter, which runs out of GPU
          # memory ("Not enough memory left") when the many GPU tests each
          # create a device at the same time, so run tests one at a time.
          - os: windows-latest
            test_args: "-- --test-threads=1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # GitHub's Linux runners have no GPU; a software Vulkan driver (lavapipe)
      # lets wgpu find an adapter so the GPU tests run instead of skipping,
      # which the 65% line-coverage floor below depends on.
      - name: Install software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace ${{ matrix.test_args }}
      - run: cargo llvm-cov --workspace --all-targets --all-features --fail-under-lines 65 ${{ matrix.test_args }}
