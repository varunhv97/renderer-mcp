[workspace]
members = [
  "crates/schema",
  "crates/renderer",
  "crates/daemon",
  "crates/cli",
  "crates/mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/varvenka/renderer-cli"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bytemuck = { version = "1.21", features = ["derive"] }
fontdue = "0.9"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
pollster = "0.4"
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
wgpu = "0.19"
